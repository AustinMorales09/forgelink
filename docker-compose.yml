# Production-like stack: SQL Server, Mosquitto broker, ForgeLink, ERP simulator, OT simulator.
#   docker compose up --build
#   http://localhost:5100  (ForgeLink)    http://localhost:5080  (ERP simulator status)
# The SA password below is a local-demo value only; use secrets / managed identity anywhere real.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ForgeLink!Dev123"
    ports: ["14333:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports: ["1883:1883"]

  erp:
    build: { context: ., dockerfile: tools/ForgeLink.ErpSimulator/Dockerfile }
    environment:
      ApiKey: dev-erp-key
      WebhookSecret: dev-webhook-secret
      ForgeLinkWebhookUrl: http://web:8080/api/erp/webhooks
      Chaos__FailureRate: "0.15"
    ports: ["5080:8080"]

  web:
    build: { context: ., dockerfile: src/ForgeLink.Web/Dockerfile }
    depends_on:
      sql: { condition: service_healthy }
      mqtt: { condition: service_started }
      erp: { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__ForgeLink: "Server=sql;Database=ForgeLink;User Id=sa;Password=ForgeLink!Dev123;TrustServerCertificate=True"
      Mqtt__EmbeddedBroker: "false"
      Mqtt__Host: mqtt
      Erp__BaseUrl: http://erp:8080/
    ports: ["5100:8080"]

  ot-sim:
    build: { context: ., dockerfile: tools/ForgeLink.OtSimulator/Dockerfile }
    depends_on: [mqtt, web]
    environment:
      Simulator__Host: mqtt
