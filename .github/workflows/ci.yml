name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (server, WPF, libraries)
    runs-on: windows-latest   # WPF needs Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked, audited)
        run: dotnet restore ForgeLink.Core.slnf
      - name: Build
        run: dotnet build ForgeLink.Core.slnf -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test ForgeLink.Core.slnf -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Vulnerable packages gate
        shell: pwsh
        run: |
          $out = dotnet list ForgeLink.Core.slnf package --vulnerable --include-transitive
          $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable packages found' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  maui:
    name: Build MAUI (Android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/ForgeLink.Mobile/ForgeLink.Mobile.csproj -c Release -f net10.0-android

  stack:
    name: Container stack smoke test (SQL Server, MQTT, ERP)
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose up -d --build
      - name: Smoke test
        run: bash tools/smoke/stack-smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
