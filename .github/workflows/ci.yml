name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (server, WPF, libraries)
    runs-on: windows-latest   # WPF needs Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (locked, audited)
        run: dotnet restore ForgeLink.Core.slnf
      - name: Build
        run: dotnet build ForgeLink.Core.slnf -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test ForgeLink.Core.slnf -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Vulnerable packages gate
        shell: pwsh
        run: |
          $out = dotnet list ForgeLink.Core.slnf package --vulnerable --include-transitive
          $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable packages found' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  maui:
    name: Build MAUI (Android)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/ForgeLink.Mobile/ForgeLink.Mobile.csproj -c Release -f net10.0-android

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/ForgeLink.Web/Dockerfile -t forgelink-web:${{ github.sha }} .
      - run: docker build -f tools/ForgeLink.ErpSimulator/Dockerfile -t forgelink-erp-sim:${{ github.sha }} .
      - run: docker build -f tools/ForgeLink.OtSimulator/Dockerfile -t forgelink-ot-sim:${{ github.sha }} .
